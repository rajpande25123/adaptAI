# railway.toml
# ============
# EduAdapt AI — Railway Deployment Configuration
# This file tells Railway exactly how to build and start the app.
# No manual configuration needed on Railway dashboard!

[build]
builder = "NIXPACKS"
buildCommand = "pip install -r requirements-vercel.txt"

[deploy]
startCommand = "uvicorn api.index:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health/"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
